<head>
    <link rel="stylesheet" href="style.css">
</head>

<div class="signin">
    <div class="content">
        <h2>Sign in</h2>
        <div class="form">
            <div class="inputBox">
                <input type="text" required>
                <i>Username</i>
            </div>
            <div class="inputBox">
                <input type="password" required>
                <i>Password</i>
            </div>
            <div class="links">
                <a href="#">Forgot Password</a>
                <a href="#">Sign up</a>
            </div>
            <div class="inputBox">
                <input type="submit" value="Login">
            </div>
        </div>
    </div>
</div>
